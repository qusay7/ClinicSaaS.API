name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # ✅ البوابة الحقيقية — ما في test project بعد بهذا الريبو (فجوة معروفة
      # سبق وحكينا عنها)، فـ build نظيف هو أقل شي نقدر نضمنه قبل أي دمج
      - name: Build
        run: dotnet build --no-restore --configuration Release
